name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A second push supersedes a run still in flight; nothing is learned from finishing the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The project compiles against Java 17 (sourceCompatibility / jvmTarget).
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Handles the Gradle distribution and the dependency/build cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Each gate is its own step. A single combined command reports one "exit code 1" and hides
      # which check failed; separate steps name the culprit in the job summary. They keep running
      # after a failure on purpose — one red run should report every broken gate, not just the first.
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: detekt (production)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:detekt

      - name: detekt (test sources)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:detektDebugUnitTest

      # Kotlin warnings are errors and Android Lint warnings are errors; the accepted leftovers
      # live in lint-baseline.xml. No release build here — signing needs a keystore that
      # deliberately lives outside the repository.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:lintDebug

      # A red run is only useful if you can see which check failed and why.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
